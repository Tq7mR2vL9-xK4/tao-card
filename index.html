<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peach · 传讯</title>
<style>
  :root {
    --my-bubble: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
    --ta-bubble: rgba(255, 255, 255, 0.85);
    --chat-bg: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
    --text-color: #333;
    --ta-text-color: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); background-size: cover; background-position: center; color: var(--text-color); transition: 0.3s; }
  /* 🌸 全新开屏动画 */
#intro { 
  position: fixed; inset: 0; background: #ffffff; z-index: 999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  animation: fadeOut 0.6s ease 3s forwards; pointer-events: none; 
}
.peach { 
  font-size: 28vw; font-weight: 900; 
  background: linear-gradient(135deg, #FFB6C1 0%, #FF8DA1 50%, #FFB6C1 100%); 
  -webkit-background-clip: text; background-clip: text; color: transparent; 
  filter: drop-shadow(0px 15px 20px rgba(255, 141, 161, 0.3));
  animation: float 2.5s ease-in-out infinite; 
}
.intro-text {
  font-size: 14px; color: #999; letter-spacing: 2px; font-weight: 300;
  animation: fadeIn 1.5s ease 0.5s both;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
/* 顶部导航 */
header { padding: 15px 20px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.4); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
.header-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.header-btn { background: transparent; border: none; font-size: 14px; color: #555; font-weight: 500; cursor: pointer; }

/* 聊天区域 */
#chatArea { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.msg { display: flex; align-items: flex-start; gap: 12px; max-width: 85%; animation: slideUp 0.3s ease; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.avatar { width: 44px; height: 44px; border-radius: 12px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
.bubble { padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-break: break-all; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.msg.me .bubble { background: var(--my-bubble); color: #fff; border-top-right-radius: 4px; }
.msg.other .bubble { background: var(--ta-bubble); color: var(--ta-text-color); border-top-left-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  /* 底部输入栏 */
footer { padding: 12px 15px 25px 15px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 10; }
.fake-input { flex: 1; background: rgba(255, 255, 255, 0.6); border-radius: 22px; padding: 12px 18px; color: #888; font-size: 15px; display: flex; align-items: center; cursor: pointer; }
footer button { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: none; color: #555; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; }
footer button:active { transform: scale(0.95); }

/* 抽屉面板 */
.drawer, .settings-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 100; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
.drawer { height: 70vh; }
.settings-panel { height: 60vh; overflow-y: auto; padding: 20px; gap: 15px; }
.drawer.open, .settings-panel.open { transform: translateY(0); }
.drawer-header { padding: 15px 20px; display: flex; gap: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); align-items: center; }
.drawer-header input { flex: 1; padding: 12px 15px; border-radius: 12px; border: none; background: rgba(0,0,0,0.05); color: #333; outline: none; font-size: 15px; }
.close-btn { background: transparent; border: none; color: #ff8fc7; font-size: 15px; font-weight: 600; }
.card-list { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; align-content: start; }
  .card-item { background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); padding: 14px 10px; border-radius: 14px; font-size: 14px; text-align: center; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: 0.2s; }
  .card-item:active { background: #fbc2eb; color: #fff; transform: scale(0.95); }

  /* 设置项 */
  .set-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
  .set-item label { font-size: 15px; color: #333; font-weight: 500; }
  .set-item input[type="text"] { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; outline: none; width: 150px; text-align: right; }
  .set-item input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer; }
</style>
</head>
<body>
  <div id="intro">
  <div class="peach">桃</div>
  <div class="intro-text">纸短情长 · 字卡传心</div>
</div>

<header>
  <div class="header-title" id="taNameDisplay" onclick="openSettings()">梦角 ▼</div>
  <button class="header-btn" onclick="openSettings()">⚙️ 设置</button>
</header>
<main id="chatArea"></main>

<footer>
  <div class="fake-input" onclick="toggleDrawer()">点击选择字卡发送...</div>
  <button onclick="toggleDrawer()">＋</button>
</footer>
<div id="drawer" class="drawer">
  <div class="drawer-header">
    <input type="text" id="searchInput" placeholder="搜索 1200+ 字卡..." oninput="renderCards()">
    <button class="close-btn" onclick="toggleDrawer()">收起</button>
  </div>
  <div id="cardList" class="card-list"></div>
</div>
<div id="settingsPanel" class="settings-panel">
  <div class="drawer-header" style="padding: 0 0 15px 0; border: none;">
    <h3 style="flex:1; font-size:18px; color:#333;">个性化设置</h3>
    <button class="close-btn" onclick="toggleDrawer('settingsPanel')">关闭</button>
  </div>
  <div class="set-item"><label>我的名字</label><input type="text" id="setMyName" onchange="updateSetting('myName', this.value)"></div>
  <div class="set-item"><label>我的头像</label><button class="header-btn" onclick="document.getElementById('uploadMyAvatar').click()">点击更换</button><input type="file" id="uploadMyAvatar" accept="image/*" hidden onchange="handleAvatar(event, 'myAvatar')"></div>
  <div class="set-item"><label>梦角名字</label><input type="text" id="setTaName" onchange="updateSetting('taName', this.value)"></div>
  <div class="set-item"><label>梦角头像</label><button class="header-btn" onclick="document.getElementById('uploadTaAvatar').click()">点击更换</button><input type="file" id="uploadTaAvatar" accept="image/*" hidden onchange="handleAvatar(event, 'taAvatar')"></div>
  <div class="set-item"><label>气泡颜色</label><input type="color" id="setBubbleColor" onchange="updateBubbleColor(this.value)"></div>
  <div class="set-item"><label>聊天背景</label><button class="header-btn" onclick="document.getElementById('uploadBg').click()">上传图片</button><input type="file" id="uploadBg" accept="image/*" hidden onchange="handleBackground(event)"></div>
  <div class="set-item"><label>恢复默认背景</label><button class="header-btn" onclick="resetBg()">重置</button></div>
</div>
<script>
  const p1 = ["好想","突然好想","今天也","此刻","一直","偷偷","认真地","超想","真的","又","还是","格外","特别","忍不住","总想","只想","想立刻","想马上","想轻轻","想安静地"];
const s1 = ["抱抱你","亲亲你","见你","靠近你","牵你的手","听你说话","陪着你","看看你","叫你的名字","和你待在一起","蹭蹭你","贴贴你","把今天讲给你听","把开心分给你","把心事说给你","等你回家","和你散步","和你发呆","和你一起吃饭","和你一起看月亮","和你一起做梦","和你一起过普通的一天","和你一起熬夜","和你一起早起","和你一起看海","和你一起淋雨","和你一起晒太阳","和你一起数星星","和你一起听歌","和你一起变老"];
  const p2 = ["晚安，","早安，","今天也要","如果可以","等下次见面","在每一个","在梦里","在风里","在月亮下面","在回家的路上","在发呆的时候","在听歌的时候","在雨天","在晴天","在冬天","在夏天","在春天","在秋天","在人群里","在安静的时候"];
const s2 = ["想抱抱你","想亲亲你","想见你","想牵你的手","想听你说话","想陪着你","想看看你","想叫你的名字","想和你待在一起","想蹭蹭你","想贴贴你","想把今天讲给你听","想把开心分给你","想把心事说给你","想等你回家","想和你散步","想和你发呆","想和你一起吃饭","想和你一起看月亮","想和你一起做梦","想和你一起过普通的一天","想和你一起熬夜","想和你一起早起","想和你一起看海","想和你一起淋雨","想和你一起晒太阳","想和你一起数星星","想和你一起听歌","想和你一起变老","想和你一起慢慢生活"];

let allCards = [];
for(let i=0; i<20; i++) for(let j=0; j<30; j++) allCards.push(p1[i] + s1[j]);
for(let i=0; i<20; i++) for(let j=0; j<30; j++) allCards.push(p2[i] + s2[j]);
  let state = JSON.parse(localStorage.getItem('peach_ins_v1')) || {
  myName: '我', myAvatar: '', taName: '梦角', taAvatar: '',
  chatBg: 'linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%)',
  myBubbleColor: '#a18cd1', chats: []
};
function save() { localStorage.setItem('peach_ins_v1', JSON.stringify(state)); }

function render() {
  document.getElementById('taNameDisplay').innerText = state.taName + ' ▼';
  document.getElementById('setMyName').value = state.myName;
  document.getElementById('setTaName').value = state.taName;
  document.getElementById('setBubbleColor').value = state.myBubbleColor;
  document.body.style.background = state.chatBg;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.documentElement.style.setProperty('--my-bubble', `linear-gradient(135deg, ${state.myBubbleColor} 0%, #fbc2eb 100%)`);

  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = state.chats.map(m => `
    <div class="msg ${m.role}">
      <div class="avatar" style="background-image: url('${m.role === 'me' ? state.myAvatar : state.taAvatar}');">
        ${(!m.role.includes('me') && !state.taAvatar) ? 'TA' : (!m.role.includes('me') && !state.myAvatar ? '我' : '')}
      </div>
      <div class="bubble">${m.text}</div>
    </div>
  `).join('');
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
          }
  function renderCards() {
  const keyword = document.getElementById('searchInput').value.trim();
  const list = document.getElementById('cardList');
  const filtered = keyword ? allCards.filter(t => t.includes(keyword)) : allCards;
  const toShow = keyword ? filtered : filtered.slice(0, 100);
  list.innerHTML = toShow.map(text => `<div class="card-item" onclick="sendCard('${text}')">${text}</div>`).join('');
}

function toggleDrawer(id = 'drawer') {
  const el = document.getElementById(id);
  el.classList.toggle('open');
  if (id === 'drawer' && el.classList.contains('open')) renderCards();
}
function openSettings() { toggleDrawer('settingsPanel'); }
