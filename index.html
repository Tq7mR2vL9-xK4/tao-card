<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃 · 字卡传讯</title>
<style>
  :root{
    --blue:#6ec6ff;
    --purple:#a78bfa;
    --pink:#ff8fc7;
    --pink2:#ffb3d9;
    --bg:#0b0b14;
    --panel2:#1d1d2d;
    --text:#f5f7ff;
    --muted:#9aa3b8;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(110,198,255,.13), transparent 35%),
      radial-gradient(circle at 85% 20%, rgba(255,143,199,.13), transparent 35%),
      var(--bg);
  }
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
/* ===== 开场动画：蓝粉“桃” ===== */
#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b14;
  pointer-events:none;
  animation:introOut .8s ease 2.4s forwards;
}
.peach{
  font-size:clamp(140px,28vw,360px);
  font-weight:900;
  line-height:1;
  letter-spacing:.04em;
  background:linear-gradient(120deg,var(--blue) 0%,var(--purple) 35%,var(--pink) 70%,var(--pink2) 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 28px rgba(255,143,199,.3)) drop-shadow(0 0 40px rgba(110,198,255,.2));
  animation:peachFlow 2.4s ease-in-out infinite alternate, peachPop .9s ease both;
}
@keyframes peachFlow{
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}
@keyframes peachPop{
  from{opacity:0;transform:scale(.72);}
  to{opacity:1;transform:scale(1);}
}
@keyframes introOut{
  to{opacity:0;visibility:hidden;}
}
/* ===== 顶部 ===== */
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(11,11,20,.82);
  backdrop-filter:blur(14px);
}
h1{
  margin:0;
  font-size:20px;
  letter-spacing:.06em;
  background:linear-gradient(90deg,var(--blue),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  white-space:nowrap;
}
.char-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.char-bar label{color:var(--muted);font-size:13px;}
select,input,textarea{
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
}
select,input{padding:9px 11px;}
textarea{
  width:100%;
  min-height:110px;
  padding:11px;
  resize:vertical;
}
button{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  color:var(--text);
  background:linear-gradient(135deg,rgba(110,198,255,.18),rgba(255,143,199,.18));
  transition:.2s;
}
button:hover{transform:translateY(-1px);border-color:rgba(255,143,199,.45);}
button.danger{background:rgba(255,80,120,.12);border-color:rgba(255,80,120,.28);}
/* ===== 布局 ===== */
main{
  width:min(1200px,100%);
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);
  gap:16px;
}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  min-width:0;
}
.panel h2,.panel h3{margin:0 0 12px;font-size:16px;}
.panel h3{margin-top:16px;font-size:14px;color:var(--muted);}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  align-items:center;
  margin-bottom:12px;
}
#search{flex:1;min-width:160px;}
#countInfo{color:var(--muted);font-size:13px;}
/* ===== 字卡 ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:9px;
}
.card{
  position:relative;
  min-height:72px;
  padding:12px 34px 12px 12px;
  text-align:left;
  line-height:1.5;
  background:linear-gradient(135deg,rgba(110,198,255,.12),rgba(255,143,199,.12));
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  overflow:hidden;
}
.card:hover{
  background:linear-gradient(135deg,rgba(110,198,255,.2),rgba(255,143,199,.2));
}
.card .tag{
  position:absolute;
  right:8px;
  bottom:6px;
  font-size:10px;
  color:var(--muted);
  opacity:.8;
}
.card .del{
  position:absolute;
  top:5px;
  right:7px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--muted);
  background:rgba(0,0,0,.18);
  font-size:15px;
  line-height:1;
}
.card .del:hover{color:#fff;background:rgba(255,80,120,.45);}
.load-more{width:100%;margin-top:12px;}
.hidden{display:none!important;}
/* ===== 传讯 ===== */
  .sent-card{
    padding:16px;
    border-radius:14px;
    border:1px dashed rgba(255,143,199,.35);
    background:rgba(255,143,199,.06);
    color:var(--muted);
    line-height:1.6;
    min-height:74px;
  }
  .sent-card.active{
    color:var(--text);
    border-style:solid;
    background:linear-gradient(135deg,rgba(110,198,255,.13),rgba(255,143,199,.13));
  }
  #logList{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:7px;
    max-height:330px;
    overflow:auto;
  }
  #logList li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    font-size:13px;
  }
  #logList small{color:var(--muted);white-space:nowrap;font-size:11px;}
  .muted{color:var(--muted);font-size:13px;line-height:1.6;}

  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:14px;}
    header{padding:12px 14px;}
    .char-bar{margin-left:0;width:100%;}
    .char-bar select{flex:1;min-width:130px;}
  }
</style>
</head>
<body>
<!-- 开场动画 -->
<div id="intro">
  <div class="peach">桃</div>
</div>

<header>
  <h1>桃 · 字卡传讯</h1>
  <div class="char-bar">
    <label for="charSelect">当前梦角</label>
    <select id="charSelect"></select>
    <button id="addCharBtn">＋ 添加梦角</button>
    <button id="delCharBtn" class="danger">删除当前</button>
  </div>
</header>
<main>
  <!-- 字卡库 -->
  <section class="panel">
    <div class="toolbar">
      <input id="search" placeholder="搜索字卡…">
      <select id="filter">
        <option value="all">全部可见</option>
        <option value="public">公用字卡</option>
        <option value="private">当前梦角专属</option>
      </select>
      <span id="countInfo"></span>
    </div>
    <div id="cards" class="cards"></div>
    <button id="loadMore" class="load-more hidden">加载更多</button>
  </section>

  <!-- 传讯面板 -->
  <section class="panel">
    <h2>传讯</h2>
    <div id="sentCard" class="sent-card">点击左侧字卡，向当前梦角传讯。</div>
    <h3>最近传讯</h3>
    <ul id="logList"></ul>
  </section>
<!-- 添加专属字卡 -->
  <section class="panel">
    <h2>添加专属字卡</h2>
    <p class="muted">每行一张，添加到当前梦角。公用字卡已内置 1200 张。</p>
    <textarea id="newCards" placeholder="例如：&#10;今天也想你&#10;晚安，做个好梦&#10;下次见面要抱很久"></textarea>
    <button id="addCardsBtn" style="margin-top:10px;">添加到当前梦角</button>
  </section>

  <!-- 备份 -->
  <section class="panel">
    <h2>备份与恢复</h2>
    <div class="toolbar">
      <button id="exportBtn">导出数据</button>
      <button id="importBtn">导入数据</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <p class="muted">数据保存在浏览器 localStorage。换浏览器或清缓存前，请先导出备份。</p>
  </section>
</main>
<script>
(function(){
  "use strict";
  const STORAGE_KEY = "peach-card-site-v1";

  function uid(prefix){
    return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }
function makeBuiltinCards(){
  const s1 = [
    "好想","突然好想","今天也","此刻","一直","偷偷","认真地","超想","真的","又",
    "还是","格外","特别","忍不住","总想","只想","想立刻","想马上","想轻轻","想安静地"
  ];
  const a1 = [
    "抱抱你","亲亲你","见你","靠近你","牵你的手","听你说话","陪着你","看看你","叫你的名字","和你待在一起",
    "蹭蹭你","贴贴你","把今天讲给你听","把开心分给你","把心事说给你","等你回家","和你散步","和你发呆","和你一起吃饭","和你一起看月亮",
    "和你一起做梦","和你一起过普通的一天","和你一起熬夜","和你一起早起","和你一起看海","和你一起淋雨","和你一起晒太阳","和你一起数星星","和你一起听歌","和你一起变老"
  ];
  const s2 = [
    "晚安，","早安，","今天也要","如果可以","等下次见面","在每一个","在梦里","在风里","在月亮下面","在回家的路上",
    "在发呆的时候","在听歌的时候","在雨天","在晴天","在冬天","在夏天","在春天","在秋天","在人群里","在安静的时候"
  ];
  const a2 = [
    "想抱抱你","想亲亲你","想见你","想牵你的手","想听你说话","想陪着你","想看看你","想叫你的名字","想和你待在一起","想蹭蹭你",
    "想贴贴你","想把今天讲给你听","想把开心分给你","想把心事说给你","想等你回家","想和你散步","想和你发呆","想和你一起吃饭","想和你一起看月亮","想和你一起做梦",
    "想和你一起过普通的一天","想和你一起熬夜","想和你一起早起","想和你一起看海","想和你一起淋雨","想和你一起晒太阳","想和你一起数星星","想和你一起听歌","想和你一起变老","想和你一起慢慢生活"
  ];
  const cards = [];
  let n = 0;

  for (const s of s1){
    for (const a of a1){
      cards.push({ id: "builtin-" + (n++), text: s + a, ownerId: null, builtin: true });
    }
  }
  for (const s of s2){
    for (const a of a2){
      cards.push({ id: "builtin-" + (n++), text: s + a, ownerId: null, builtin: true });
    }
  }
  return cards;
}

function defaultState(){
  const charId = uid("char");
  return {
    version: 1,
    chars: [{ id: charId, name: "我的梦角" }],
    currentCharId: charId,
    cards: makeBuiltinCards(),
    logs: {}
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.chars) && Array.isArray(s.cards)){
        if (!s.logs) s.logs = {};
        if (!s.currentCharId && s.chars[0]) s.currentCharId = s.chars[0].id;
        return s;
      }
    }
  }catch(e){
    console.warn("读取本地数据失败", e);
  }
  const s = defaultState();
  saveState(s);
  return s;
}

function saveState(s){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s || state));
}

let state = loadState();
  const charSelect = document.getElementById("charSelect");
const addCharBtn = document.getElementById("addCharBtn");
const delCharBtn = document.getElementById("delCharBtn");
const searchInput = document.getElementById("search");
const filterSelect = document.getElementById("filter");
const countInfo = document.getElementById("countInfo");
const cardsEl = document.getElementById("cards");
const loadMoreBtn = document.getElementById("loadMore");
const sentCard = document.getElementById("sentCard");
const logList = document.getElementById("logList");
const newCards = document.getElementById("newCards");
const addCardsBtn = document.getElementById("addCardsBtn");
const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");
const importFile = document.getElementById("importFile");

let visibleCount = 300;

function currentChar(){
  return state.chars.find(c => c.id === state.currentCharId) || state.chars[0] || null;
                                                       }
  function renderChars(){
  charSelect.innerHTML = state.chars.map(c =>
    `<option value="${c.id}" ${c.id === state.currentCharId ? "selected" : ""}>${escapeHtml(c.name)}</option>`
  ).join("");
}

function getFilteredCards(){
  const q = searchInput.value.trim().toLowerCase();
  const f = filterSelect.value;
  const cid = state.currentCharId;
  return state.cards.filter(card => {
    if (card.ownerId !== null && card.ownerId !== cid) return false;
    if (f === "public" && card.ownerId !== null) return false;
    if (f === "private" && card.ownerId !== cid) return false;
    if (q && !card.text.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderCards(){
  const filteredCards = getFilteredCards();
  const shown = filteredCards.slice(0, visibleCount);
  cardsEl.innerHTML = shown.map(card => {
    const isPrivate = card.ownerId !== null;
    return `
      <button class="card" data-id="${card.id}" type="button">
        <span class="card-text">${escapeHtml(card.text)}</span>
        <span class="tag">${isPrivate ? "专属" : "公用"}</span>
        ${isPrivate ? `<span class="del" data-del="${card.id}" title="删除这张专属字卡">×</span>` : ""}
      </button>
    `;
  }).join("");
  countInfo.textContent = `共 ${filteredCards.length} 张，显示 ${Math.min(visibleCount, filteredCards.length)} 张`;
  loadMoreBtn.classList.toggle("hidden", filteredCards.length <= visibleCount);
                          }
  function renderLogs(){
  const char = currentChar();
  const logs = (char && state.logs[char.id]) ? state.logs[char.id] : [];
  if (!logs.length){
    logList.innerHTML = `<li class="muted">还没有传讯记录</li>`;
    return;
  }
  logList.innerHTML = logs.slice(0, 12).map(item => `
    <li>
      <span>${escapeHtml(item.text)}</span>
      <small>${escapeHtml(item.time)}</small>
    </li>
  `).join("");
}

function renderAll(){
  renderChars();
  renderCards();
  renderLogs();
}

function sendCard(cardId){
  const card = state.cards.find(c => c.id === cardId);
  const char = currentChar();
  if (!card || !char) return;
  const time = new Date().toLocaleString("zh-CN", { hour12: false });
  if (!state.logs[char.id]) state.logs[char.id] = [];
  state.logs[char.id].unshift({ text: card.text, time: time });
  state.logs[char.id] = state.logs[char.id].slice(0, 100);
  saveState();
  sentCard.textContent = `已向「${char.name}」传讯：${card.text}`;
  sentCard.classList.add("active");
  renderLogs();
}
  cardsEl.addEventListener("click", function(e){
  const delEl = e.target.closest("[data-del]");
  if (delEl){
    e.stopPropagation();
    const id = delEl.dataset.del;
    const card = state.cards.find(c => c.id === id);
    if (!card) return;
    if (!confirm(`删除这张专属字卡？\n\n${card.text}`)) return;
    state.cards = state.cards.filter(c => c.id !== id);
    saveState();
    renderCards();
    return;
  }
  const cardEl = e.target.closest(".card");
  if (cardEl && cardEl.dataset.id) sendCard(cardEl.dataset.id);
});

addCharBtn.addEventListener("click", function(){
  const name = prompt("输入新梦角名字：");
  if (!name || !name.trim()) return;
  const id = uid("char");
  state.chars.push({ id: id, name: name.trim() });
  state.currentCharId = id;
  saveState();
  visibleCount = 300;
  renderAll();
});
  delCharBtn.addEventListener("click", function(){
  if (state.chars.length <= 1){ alert("至少要保留一个梦角。"); return; }
  const char = currentChar();
  if (!char) return;
  if (!confirm(`删除梦角「${char.name}」？\n该梦角的专属字卡和传讯记录也会删除。`)) return;
  state.chars = state.chars.filter(c => c.id !== char.id);
  state.cards = state.cards.filter(c => c.ownerId !== char.id);
  delete state.logs[char.id];
  state.currentCharId = state.chars[0].id;
  saveState();
  visibleCount = 300;
  sentCard.textContent = "点击左侧字卡，向当前梦角传讯。";
  sentCard.classList.remove("active");
  renderAll();
});

charSelect.addEventListener("change", function(){
  state.currentCharId = charSelect.value;
  saveState();
  visibleCount = 300;
  sentCard.textContent = "点击左侧字卡，向当前梦角传讯。";
  sentCard.classList.remove("active");
  renderAll();
});
  exportBtn.addEventListener("click", function(){
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `桃字卡备份-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener("click", function(){ importFile.click(); });

  importFile.addEventListener("change", function(){
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.chars) || !Array.isArray(data.cards)) throw new Error("格式不正确");
        if (!data.logs) data.logs = {};
        if (!data.currentCharId || !data.chars.some(c => c.id === data.currentCharId)){
          data.currentCharId = data.chars[0] && data.chars[0].id;
        }
        if (!data.currentCharId) throw new Error("没有梦角");
        state = data;
        saveState();
        visibleCount = 300;
        sentCard.textContent = "点击左侧字卡，向当前梦角传讯。";
        sentCard.classList.remove("active");
        renderAll();
        alert("导入成功。");
      }catch(err){
        alert("导入失败：文件不是本站导出的备份，或内容已损坏。");
      }finally{
        importFile.value = "";
      }
    };
    reader.readAsText(file, "utf-8");
  });

  renderAll();
})();
</script>
</body>
</html>
