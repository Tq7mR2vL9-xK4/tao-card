<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃 · 字卡传讯</title>
<style>
  :root{
    --blue:#6ec6ff;
    --purple:#a78bfa;
    --pink:#ff8fc7;
    --pink2:#ffb3d9;
    --bg:#0b0b14;
    --panel2:#1d1d2d;
    --text:#f5f7ff;
    --muted:#9aa3b8;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(110,198,255,.13), transparent 35%),
      radial-gradient(circle at 85% 20%, rgba(255,143,199,.13), transparent 35%),
      var(--bg);
  }
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
/* ===== 开场动画：蓝粉“桃” ===== */
#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b14;
  pointer-events:none;
  animation:introOut .8s ease 2.4s forwards;
}
.peach{
  font-size:clamp(140px,28vw,360px);
  font-weight:900;
  line-height:1;
  letter-spacing:.04em;
  background:linear-gradient(120deg,var(--blue) 0%,var(--purple) 35%,var(--pink) 70%,var(--pink2) 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 28px rgba(255,143,199,.3)) drop-shadow(0 0 40px rgba(110,198,255,.2));
  animation:peachFlow 2.4s ease-in-out infinite alternate, peachPop .9s ease both;
}
@keyframes peachFlow{
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}
@keyframes peachPop{
  from{opacity:0;transform:scale(.72);}
  to{opacity:1;transform:scale(1);}
}
@keyframes introOut{
  to{opacity:0;visibility:hidden;}
}
/* ===== 顶部 ===== */
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(11,11,20,.82);
  backdrop-filter:blur(14px);
}
h1{
  margin:0;
  font-size:20px;
  letter-spacing:.06em;
  background:linear-gradient(90deg,var(--blue),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  white-space:nowrap;
}
.char-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.char-bar label{color:var(--muted);font-size:13px;}
select,input,textarea{
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
}
select,input{padding:9px 11px;}
textarea{
  width:100%;
  min-height:110px;
  padding:11px;
  resize:vertical;
}
button{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  color:var(--text);
  background:linear-gradient(135deg,rgba(110,198,255,.18),rgba(255,143,199,.18));
  transition:.2s;
}
button:hover{transform:translateY(-1px);border-color:rgba(255,143,199,.45);}
button.danger{background:rgba(255,80,120,.12);border-color:rgba(255,80,120,.28);}
/* ===== 布局 ===== */
main{
  width:min(1200px,100%);
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);
  gap:16px;
}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  min-width:0;
}
.panel h2,.panel h3{margin:0 0 12px;font-size:16px;}
.panel h3{margin-top:16px;font-size:14px;color:var(--muted);}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  align-items:center;
  margin-bottom:12px;
}
#search{flex:1;min-width:160px;}
#countInfo{color:var(--muted);font-size:13px;}
/* ===== 字卡 ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:9px;
}
.card{
  position:relative;
  min-height:72px;
  padding:12px 34px 12px 12px;
  text-align:left;
  line-height:1.5;
  background:linear-gradient(135deg,rgba(110,198,255,.12),rgba(255,143,199,.12));
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  overflow:hidden;
}
.card:hover{
  background:linear-gradient(135deg,rgba(110,198,255,.2),rgba(255,143,199,.2));
}
.card .tag{
  position:absolute;
  right:8px;
  bottom:6px;
  font-size:10px;
  color:var(--muted);
  opacity:.8;
}
.card .del{
  position:absolute;
  top:5px;
  right:7px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--muted);
  background:rgba(0,0,0,.18);
  font-size:15px;
  line-height:1;
}
.card .del:hover{color:#fff;background:rgba(255,80,120,.45);}
.load-more{width:100%;margin-top:12px;}
.hidden{display:none!important;}
/* ===== 传讯 ===== */
  .sent-card{
    padding:16px;
    border-radius:14px;
    border:1px dashed rgba(255,143,199,.35);
    background:rgba(255,143,199,.06);
    color:var(--muted);
    line-height:1.6;
    min-height:74px;
  }
  .sent-card.active{
    color:var(--text);
    border-style:solid;
    background:linear-gradient(135deg,rgba(110,198,255,.13),rgba(255,143,199,.13));
  }
  #logList{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:7px;
    max-height:330px;
    overflow:auto;
  }
  #logList li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    font-size:13px;
  }
  #logList small{color:var(--muted);white-space:nowrap;font-size:11px;}
  .muted{color:var(--muted);font-size:13px;line-height:1.6;}

  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:14px;}
    header{padding:12px 14px;}
    .char-bar{margin-left:0;width:100%;}
    .char-bar select{flex:1;min-width:130px;}
  }
</style>
</head>
<body>
<!-- 开场动画 -->
<div id="intro">
  <div class="peach">桃</div>
</div>

<header>
  <h1>桃 · 字卡传讯</h1>
  <div class="char-bar">
    <label for="charSelect">当前梦角</label>
    <select id="charSelect"></select>
    <button id="addCharBtn">＋ 添加梦角</button>
    <button id="delCharBtn" class="danger">删除当前</button>
  </div>
</header>
<main>
  <!-- 字卡库 -->
  <section class="panel">
    <div class="toolbar">
      <input id="search" placeholder="搜索字卡…">
      <select id="filter">
        <option value="all">全部可见</option>
        <option value="public">公用字卡</option>
        <option value="private">当前梦角专属</option>
      </select>
      <span id="countInfo"></span>
    </div>
    <div id="cards" class="cards"></div>
    <button id="loadMore" class="load-more hidden">加载更多</button>
  </section>

  <!-- 传讯面板 -->
  <section class="panel">
    <h2>传讯</h2>
    <div id="sentCard" class="sent-card">点击左侧字卡，向当前梦角传讯。</div>
    <h3>最近传讯</h3>
    <ul id="logList"></ul>
  </section>
<!-- 添加专属字卡 -->
  <section class="panel">
    <h2>添加专属字卡</h2>
    <p class="muted">每行一张，添加到当前梦角。公用字卡已内置 1200 张。</p>
    <textarea id="newCards" placeholder="例如：&#10;今天也想你&#10;晚安，做个好梦&#10;下次见面要抱很久"></textarea>
    <button id="addCardsBtn" style="margin-top:10px;">添加到当前梦角</button>
  </section>

  <!-- 备份 -->
  <section class="panel">
    <h2>备份与恢复</h2>
    <div class="toolbar">
      <button id="exportBtn">导出数据</button>
      <button id="importBtn">导入数据</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <p class="muted">数据保存在浏览器 localStorage。换浏览器或清缓存前，请先导出备份。</p>
  </section>
</main>
<script>
(function(){
  "use strict";
  const STORAGE_KEY = "peach-card-site-v1";

  function uid(prefix){
    return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }
