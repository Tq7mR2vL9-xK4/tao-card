<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Peach · 梦角空间</title>
<style>
  :root {
    --bg: #ffffff; --header-bg: rgba(255,255,255,0.9);
    --my-bubble: #000000; --ta-bubble: #f0f0f0;
    --my-text: #ffffff; --ta-text: #333333; --font-main: sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-size: cover; background-position: center; }
  header { padding: 15px 20px; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; }
.header-title { font-size: 18px; font-weight: bold; color: #333; }
.header-btn { background: transparent; border: none; font-size: 16px; color: #666; cursor: pointer; }
main { flex: 1; overflow-y: auto; min-height: 0; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
.msg-row { display: flex; flex-direction: column; width: 100%; }
.msg-row.me { align-items: flex-end; }
.msg-row.other { align-items: flex-start; }
.msg-info { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #888; }
.msg-row.me .msg-info { flex-direction: row-reverse; }
.avatar { width: 34px; height: 34px; border-radius: 6px; background: #ddd; background-size: cover; background-position: center; }
.bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-break: break-all; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.msg-row.me .bubble { background: var(--my-bubble); color: var(--my-text); border-top-right-radius: 2px; }
.msg-row.other .bubble { background: var(--ta-bubble); color: var(--ta-text); border-top-left-radius: 2px; }
  footer { padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); background: var(--header-bg); backdrop-filter: blur(10px); display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); z-index: 10; flex-shrink: 0; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.05); border: none; color: #333; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-box { flex: 1; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 8px 15px; border: none; outline: none; font-size: 15px; color: #333; height: 38px; }
.send-btn { padding: 8px 16px; border-radius: 20px; background: #333; color: #fff; border: none; font-size: 14px; font-weight: bold; }
.drawer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 100; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
.drawer.open { transform: translateY(0); }
.drawer-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; flex-shrink: 0; }
.close-btn { background: transparent; border: none; color: #ff8fc7; font-size: 15px; font-weight: bold; }
  .set-group { padding: 15px 20px; border-bottom: 1px dashed #eee; }
  .set-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .set-item label { font-size: 14px; color: #333; }
  .set-item input[type="text"], .set-item select { padding: 6px; border: 1px solid #ddd; border-radius: 6px; width: 140px; font-size: 13px; }
  input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 50%; background: none; cursor: pointer; padding: 0; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid #ddd; border-radius: 50%; }
</style>
</head>
<body>
  <header>
  <button class="header-btn" onclick="openDrawer('settingsPanel')">⚙️ 设置</button>
  <div class="header-title" id="taNameDisplay">梦角</div>
  <button class="header-btn" onclick="alert('朋友圈马上来！')">朋友圈</button>
</header>

<main id="chatArea"></main>

<footer>
  <button class="icon-btn" onclick="openDrawer('menuDrawer')">＋</button>
  <input type="text" class="input-box" id="msgInput" placeholder="说点什么...">
  <button class="send-btn" onclick="sendText()">发送</button>
</footer>
<div id="menuDrawer" class="drawer" style="height: 25vh;">
  <div class="drawer-header"><h3>快捷功能</h3><button class="close-btn" onclick="closeDrawer('menuDrawer')">收起</button></div>
  <div style="display:flex; gap:20px; padding:20px; justify-content:center;">
    <button class="icon-btn" style="width:60px;height:60px;flex-direction:column;" onclick="openDrawer('cardDrawer')">🃏<span style="font-size:10px;margin-top:4px">字卡</span></button>
    <button class="icon-btn" style="width:60px;height:60px;flex-direction:column;" onclick="alert('红包开发中！')">🧧<span style="font-size:10px;margin-top:4px">红包</span></button>
  </div>
</div>

<div id="cardDrawer" class="drawer" style="height: 60vh;">
  <div class="drawer-header"><h3>字卡库</h3><button class="close-btn" onclick="closeDrawer('cardDrawer')">收起</button></div>
  <div style="padding: 10px;"><input type="text" class="input-box" id="searchCard" style="width:100%" placeholder="搜索字卡..." oninput="renderCards()"></div>
  <div id="cardList" style="flex:1; overflow-y:auto; padding:15px; display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px; align-content:start;"></div>
</div>
<div id="settingsPanel" class="drawer" style="height: 75vh; overflow-y:auto;">
  <div class="drawer-header"><h3>个性化设置</h3><button class="close-btn" onclick="closeDrawer('settingsPanel')">关闭</button></div>
  <div class="set-group">
    <div class="set-item"><label>我的名字</label><input type="text" id="setMyName" onchange="updateSetting('myName', this.value)"></div>
    <div class="set-item"><label>梦角名字</label><input type="text" id="setTaName" onchange="updateSetting('taName', this.value)"></div>
    <div class="set-item"><label>全局字体</label>
      <select id="setFont" onchange="updateColor('font', this.value)">
        <option value="-apple-system, sans-serif">系统默认</option>
        <option value="'KaiTi', '楷体', serif">温婉楷体</option>
        <option value="'SimSun', '宋体', serif">经典宋体</option>
      </select>
    </div>
  </div>
  <div class="set-group">
    <div class="set-item"><label>聊天背景</label><button class="header-btn" onclick="document.getElementById('uploadBg').click()">上传图片</button><input type="file" id="uploadBg" accept="image/*" hidden onchange="handleBackground(event)"></div>
    <div class="set-item"><label>顶栏/底栏颜色</label><input type="color" id="setHeaderBg" onchange="updateColor('headerBg', this.value)"></div>
    <div class="set-item"><label>我的气泡色</label><input type="color" id="setMyBubble" onchange="updateColor('myBubble', this.value)"></div>
    <div class="set-item"><label>我的文字色</label><input type="color" id="setMyText" onchange="updateColor('myText', this.value)"></div>
    <div class="set-item"><label>梦角气泡色</label><input type="color" id="setTaBubble" onchange="updateColor('taBubble', this.value)"></div>
    <div class="set-item"><label>梦角文字色</label><input type="color" id="setTaText" onchange="updateColor('taText', this.value)"></div>
  </div>
</div>

  let state = JSON.parse(localStorage.getItem('peach_v3')) || {
  myName: '我', taName: '梦角', myAvatar: '', taAvatar: '',
  bg: '#ffffff', headerBg: '#ffffff',
  myBubble: '#000000', taBubble: '#f0f0f0',
  myText: '#ffffff', taText: '#333333',
  font: '-apple-system, sans-serif',
  chats: []
};

function save() { localStorage.setItem('peach_v3', JSON.stringify(state)); }
  function render() {
  document.documentElement.style.setProperty('--bg', state.bg);
  document.documentElement.style.setProperty('--header-bg', state.headerBg);
  document.documentElement.style.setProperty('--my-bubble', state.myBubble);
  document.documentElement.style.setProperty('--ta-bubble', state.taBubble);
  document.documentElement.style.setProperty('--my-text', state.myText);
  document.documentElement.style.setProperty('--ta-text', state.taText);
  document.documentElement.style.setProperty('--font-main', state.font);

  document.getElementById('taNameDisplay').innerText = state.taName;
  document.getElementById('setMyName').value = state.myName;
  document.getElementById('setTaName').value = state.taName;
  document.getElementById('setFont').value = state.font;
  document.getElementById('setHeaderBg').value = state.headerBg.startsWith('#') ? state.headerBg : '#ffffff';
  document.getElementById('setMyBubble').value = state.myBubble;
  document.getElementById('setTaBubble').value = state.taBubble;
  document.getElementById('setMyText').value = state.myText;
  document.getElementById('setTaText').value = state.taText;
    const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = state.chats.map(m => `
    <div class="msg-row ${m.role}">
      <div class="msg-info">
        <div class="avatar" style="background-image:url('${m.role === 'me' ? state.myAvatar : state.taAvatar}')"></div>
        <span>${m.role === 'me' ? state.myName : state.taName}</span>
      </div>
      <div class="bubble">${m.text}</div>
    </div>
  `).join('');
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

function openDrawer(id) { document.getElementById(id).classList.add('open'); if(id==='cardDrawer') renderCards(); }
function closeDrawer(id) { document.getElementById(id).classList.remove('open'); }
  function renderCards() {
  const keyword = document.getElementById('searchCard').value.trim();
  const list = document.getElementById('cardList');
  const filtered = keyword ? allCards.filter(t => t.includes(keyword)) : allCards;
  const toShow = keyword ? filtered : filtered.slice(0, 150);
  list.innerHTML = toShow.map(text => `<div style="background:#f5f5f5; border-radius:10px; padding:10px; font-size:13px; text-align:center; cursor:pointer;" onclick="sendCard('${text}')">${text}</div>`).join('');
}

function sendText() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  state.chats.push({ role: 'me', text: text });
  input.value = ''; save(); render(); triggerReply();
}

function sendCard(text) {
  state.chats.push({ role: 'me', text: text });
  save(); render(); closeDrawer('menuDrawer'); closeDrawer('cardDrawer'); triggerReply();
}

function triggerReply() {
  setTimeout(() => {
    const randomReply = allCards[Math.floor(Math.random() * allCards.length)];
    state.chats.push({ role: 'other', text: randomReply });
    save(); render();
  }, 1000);
}

function updateSetting(key, val) { if(!val.trim()) return; state[key] = val.trim(); save(); render(); }
function updateColor(key, val) { state[key] = val; save(); render(); }

function handleBackground(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { state.bg = `url(${e.target.result})`; state.headerBg = 'rgba(255, 255, 255, 0.4)'; save(); render(); };
  reader.readAsDataURL(file);
  event.target.value = '';
}

render();
</script>
