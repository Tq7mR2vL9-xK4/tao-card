<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peach · 传讯</title>
<style>
  :root {
    --my-bubble: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
    --ta-bubble: rgba(255, 255, 255, 0.85);
    --chat-bg: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
    --text-color: #333;
    --ta-text-color: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); background-size: cover; background-position: center; color: var(--text-color); transition: 0.3s; }
  /* 🌸 全新开屏动画 */
#intro { 
  position: fixed; inset: 0; background: #ffffff; z-index: 999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  animation: fadeOut 0.6s ease 3s forwards; pointer-events: none; 
}
.peach { 
  font-size: 28vw; font-weight: 900; 
  background: linear-gradient(135deg, #FFB6C1 0%, #FF8DA1 50%, #FFB6C1 100%); 
  -webkit-background-clip: text; background-clip: text; color: transparent; 
  filter: drop-shadow(0px 15px 20px rgba(255, 141, 161, 0.3));
  animation: float 2.5s ease-in-out infinite; 
}
.intro-text {
  font-size: 14px; color: #999; letter-spacing: 2px; font-weight: 300;
  animation: fadeIn 1.5s ease 0.5s both;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
