<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃 · 字卡传讯</title>
<style>
  :root{
    --blue:#6ec6ff;
    --purple:#a78bfa;
    --pink:#ff8fc7;
    --pink2:#ffb3d9;
    --bg:#0b0b14;
    --panel2:#1d1d2d;
    --text:#f5f7ff;
    --muted:#9aa3b8;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(110,198,255,.13), transparent 35%),
      radial-gradient(circle at 85% 20%, rgba(255,143,199,.13), transparent 35%),
      var(--bg);
  }
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
