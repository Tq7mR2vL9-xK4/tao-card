<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃 · 字卡传讯</title>
<style>
  :root{
    --blue:#6ec6ff;
    --purple:#a78bfa;
    --pink:#ff8fc7;
    --pink2:#ffb3d9;
    --bg:#0b0b14;
    --panel2:#1d1d2d;
    --text:#f5f7ff;
    --muted:#9aa3b8;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(110,198,255,.13), transparent 35%),
      radial-gradient(circle at 85% 20%, rgba(255,143,199,.13), transparent 35%),
      var(--bg);
  }
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
/* ===== 开场动画：蓝粉“桃” ===== */
#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b14;
  pointer-events:none;
  animation:introOut .8s ease 2.4s forwards;
}
.peach{
  font-size:clamp(140px,28vw,360px);
  font-weight:900;
  line-height:1;
  letter-spacing:.04em;
  background:linear-gradient(120deg,var(--blue) 0%,var(--purple) 35%,var(--pink) 70%,var(--pink2) 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 28px rgba(255,143,199,.3)) drop-shadow(0 0 40px rgba(110,198,255,.2));
  animation:peachFlow 2.4s ease-in-out infinite alternate, peachPop .9s ease both;
}
@keyframes peachFlow{
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}
@keyframes peachPop{
  from{opacity:0;transform:scale(.72);}
  to{opacity:1;transform:scale(1);}
}
@keyframes introOut{
  to{opacity:0;visibility:hidden;}
}
/* ===== 顶部 ===== */
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(11,11,20,.82);
  backdrop-filter:blur(14px);
}
h1{
  margin:0;
  font-size:20px;
  letter-spacing:.06em;
  background:linear-gradient(90deg,var(--blue),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  white-space:nowrap;
}
.char-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.char-bar label{color:var(--muted);font-size:13px;}
select,input,textarea{
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
}
select,input{padding:9px 11px;}
textarea{
  width:100%;
  min-height:110px;
  padding:11px;
  resize:vertical;
}
button{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  color:var(--text);
  background:linear-gradient(135deg,rgba(110,198,255,.18),rgba(255,143,199,.18));
  transition:.2s;
}
button:hover{transform:translateY(-1px);border-color:rgba(255,143,199,.45);}
button.danger{background:rgba(255,80,120,.12);border-color:rgba(255,80,120,.28);}
