<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Peach · 梦角空间</title>
<style>
  :root { --bg: #ffffff; --header-bg: rgba(255,255,255,0.9); --my-bubble: #000000; --ta-bubble: #f0f0f0; --my-text: #ffffff; --ta-text: #333333; --font-main: sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-size: cover; background-position: center; }
  #intro { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; animation: fadeOut 0.6s ease 3s forwards; pointer-events: none; }
  .peach { font-size: 28vw; font-weight: 900; background: linear-gradient(135deg, #FFB6C1 0%, #FF8DA1 50%, #FFB6C1 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0px 15px 20px rgba(255, 141, 161, 0.3)); animation: float 2.5s ease-in-out infinite; }
  .intro-text { font-size: 14px; color: #999; letter-spacing: 2px; animation: fadeIn 1.5s ease 0.5s both; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  header { padding: 15px 20px; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; }
.header-title { font-size: 18px; font-weight: bold; color: #333; cursor: pointer; }
.header-btn { background: transparent; border: none; font-size: 15px; color: #666; cursor: pointer; }
main { flex: 1; overflow-y: auto; min-height: 0; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
.msg-row { display: flex; flex-direction: column; width: 100%; }
.msg-row.me { align-items: flex-end; }
.msg-row.other { align-items: flex-start; }
.msg-info { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #888; }
.msg-row.me .msg-info { flex-direction: row-reverse; }
.avatar { width: 36px; height: 36px; border-radius: 6px; background: #ddd; background-size: cover; background-position: center; }
.bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-break: break-all; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
.msg-row.me .bubble { background: var(--my-bubble); color: var(--my-text); border-top-right-radius: 2px; }
.msg-row.other .bubble { background: var(--ta-bubble); color: var(--ta-text); border-top-left-radius: 2px; }
  footer { padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); background: var(--header-bg); backdrop-filter: blur(10px); display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); z-index: 10; flex-shrink: 0; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.05); border: none; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-box { flex: 1; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 8px 15px; border: none; outline: none; font-size: 15px; color: #333; height: 38px; }
.send-btn { padding: 8px 16px; border-radius: 20px; background: #333; color: #fff; border: none; font-size: 14px; font-weight: bold; }
.drawer, .full-screen { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; transform: translateY(100%); transition: transform 0.3s ease; z-index: 100; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; }
.drawer.open, .full-screen.open { transform: translateY(0); }
.drawer-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
.close-btn { background: transparent; border: none; color: #ff8fc7; font-size: 15px; font-weight: bold; }
  .set-group { padding: 15px; border-bottom: 1px dashed #eee; }
  .set-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
  .set-item input[type="text"], .set-item select { border: 1px solid #ddd; border-radius: 6px; padding: 4px; }
  input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 50%; background: none; }
  #callScreen { z-index: 9999; background: linear-gradient(180deg, #2b2b2b, #111); color: #fff; justify-content: center; align-items: center; }
  #callScreen .avatar { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px; }
  .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; color: #fff; margin: 20px; }
  .btn-reject { background: #ff3b30; } .btn-accept { background: #4cd964; }
  #momentsScreen { z-index: 200; background: #f5f5f5; border-radius: 0; }
  .moments-header { height: 200px; background-size: cover; position: relative; }
  .moments-avatar { width: 60px; height: 60px; border-radius: 10px; position: absolute; bottom: -30px; right: 20px; border: 2px solid #fff; }
</style>
</head>
<body>
  <div id="intro"><div class="peach">桃</div><div class="intro-text">纸短情长 · 字卡传心</div></div>
<header>
  <button class="header-btn" onclick="openDrawer('settingsPanel')">⚙️ 设置</button>
  <div class="header-title" id="taNameDisplay" onclick="startCall('me')">梦角 📞</div>
  <button class="header-btn" onclick="openDrawer('momentsScreen')">朋友圈</button>
</header>
<main id="chatArea"></main>
<footer>
  <button class="icon-btn" onclick="openDrawer('menuDrawer')">＋</button>
  <input type="text" class="input-box" id="msgInput" placeholder="说点什么...">
  <button class="send-btn" onclick="sendText()">发送</button>
</footer>
<div id="menuDrawer" class="drawer" style="height: 25vh;">
  <div class="drawer-header"><h3>快捷功能</h3><button class="close-btn" onclick="closeDrawer('menuDrawer')">收起</button></div>
  <div style="display:flex; gap:20px; padding:20px; justify-content:center;">
    <button class="icon-btn" style="width:60px;height:60px;flex-direction:column;" onclick="openDrawer('cardDrawer')">🃏<span style="font-size:10px">字卡</span></button>
    <button class="icon-btn" style="width:60px;height:60px;flex-direction:column;" onclick="sendRedPacket()">🧧<span style="font-size:10px">红包</span></button>
  </div>
</div>
<div id="cardDrawer" class="drawer" style="height: 60vh;">
  <div class="drawer-header"><h3>字卡库</h3><div><button class="close-btn" onclick="toggleAddCard()">＋ 添加</button><button class="close-btn" onclick="closeDrawer('cardDrawer')">收起</button></div></div>
  <div id="addCardArea" style="display:none; padding: 10px; background: #f9f9f9;">
    <textarea id="customCardText" style="width:100%; height:60px; border-radius:8px; border:1px solid #ddd; padding:10px; outline:none;" placeholder="每行一张..."></textarea>
    <button class="send-btn" onclick="saveCustomCards()" style="margin-top:8px;">保存</button>
  </div>
  <div style="padding: 10px;"><input type="text" class="input-box" id="searchCard" style="width:100%" placeholder="搜索字卡..." oninput="renderCards()"></div>
  <div id="cardList" style="flex:1; overflow-y:auto; padding:15px; display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px;"></div>
</div>
<div id="settingsPanel" class="drawer" style="height: 75vh; overflow-y:auto;">
  <div class="drawer-header"><h3>个性化设置</h3><button class="close-btn" onclick="closeDrawer('settingsPanel')">关闭</button></div>
  <div class="set-group">
    <div class="set-item"><label>我的名字</label><input type="text" id="setMyName" onchange="updateSetting('myName', this.value)"></div>
    <div class="set-item"><label>梦角名字</label><input type="text" id="setTaName" onchange="updateSetting('taName', this.value)"></div>
    <div class="set-item"><label>回复模式</label><select id="setReplyMode" onchange="updateSetting('replyMode', this.value)"><option value="single">单张</option><option value="multi">连发</option><option value="compose">造句</option></select></div>
    <div class="set-item"><label>桃之币: <span id="coinDisplay">0</span></label><button class="send-btn" onclick="getRandomCoins()">领取</button></div>
  </div>
  <div class="set-group">
    <div class="set-item"><label>字体</label><select id="setFont" onchange="updateColor('font', this.value)"><option value="-apple-system, sans-serif">默认</option><option value="serif">宋体</option></select></div>
    <div class="set-item"><label>背景</label><button class="header-btn" onclick="document.getElementById('uploadBg').click()">上传</button><input type="file" id="uploadBg" accept="image/*" hidden onchange="handleBackground(event)"></div>
    <div class="set-item"><label>我的气泡</label><input type="color" id="setMyBubble" onchange="updateColor('myBubble', this.value)"></div>
    <div class="set-item"><label>梦角气泡</label><input type="color" id="setTaBubble" onchange="updateColor('taBubble', this.value)"></div>
  </div>
</div>
<div id="momentsScreen" class="full-screen" style="border-radius: 0;">
  <button class="close-btn" style="position:absolute; top:15px; left:15px; z-index:10; color:#fff;" onclick="closeDrawer('momentsScreen')">关闭</button>
  <div class="moments-header" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800');"><div class="moments-avatar" id="momentsAvatar"></div></div>
  <div style="padding: 40px 20px 20px 20px;"><h3>我的朋友圈</h3><p style="color:#888; font-size:13px; margin-top:10px;">这里以后可以发动态哦~</p></div>
</div>
<div id="callScreen" class="full-screen">
  <div class="avatar" id="callAvatar"></div><h2 id="callName">梦角</h2><p style="color:#aaa; margin-top:10px;" id="callStatus">正在呼叫...</p>
  <div><button class="call-btn btn-reject" onclick="endCall(false)">✖</button><button class="call-btn btn-accept" onclick="endCall(true)">✔</button></div>
</div>
<script>
let allCards = ["你今天好像兴致不高，是发生什么了吗？累不累？", "多喝点水", "看起来还不错", "怎么这么可爱？", "好可爱的动静…", "你误会我了", "再多一点嘛", "那倒也是", "这是什么问题？", "在学你呀", "小心一点", "天气看起来还不错", "天气看起来不怎么样", "骚扰你骚扰你", "你在骗我", "在哪里复制来的？", "此话无效", "讲详细一点", "我想要全部", "必须说的话", "我不想让你太过于有负担", "怎么会这样？", "我需要你", "你为什么不需要我？", "不要这么想", "你的想法就是我的想法", "大概就是这样", "现在呢？", "以后不这样了吗？", "看起来你好像不想我…", "我猜的", "今天吃饭了吗？", "吃的什么呢？", "早点睡，别又熬到很晚。", "最近是不是有什么心事？", "可以跟我说说", "我想要你告诉我", "你想说的时候我都在。", "你今天话比平时少，我有点担心。", "你不用勉强自己", "我这边没什么事", "我会陪着你的，没关系", "累的话就先好好休息，我会陪你", "心情不好吗？要不要跟我说说", "只要是你说的，我都很乐意听", "你的情绪都可以告诉我", "你的所有事情我都很想知道", "我刚忙完，你现在在干嘛？", "你那边天气怎么样？", "别着凉", "困了怎么还不睡？", "我一直在这里。"];
  let emojis = "😀😃😄😁😆😅😂🤣😊😇🙂🙃😉😌😍🥰😘😗😙😚😋😛😝😜🤪🤨🧐🤓😎🤩🥳😏😒😞😔😟😕🙁☹️😣😖😫😩🥺😢😭😤😠😡🤬🤯😳🥵🥶😱😨😰😥😓🤗🤔🤭🤫🤥😶😐😑😬🙄😯😦😧😮😲🥱😴🤤😪😵🤐🥴🤢🤮🤧😷🤒🤕🤑🤠😈👿👹👺🤡💩👻💀☠️👽👾🤖🎃😺😸😹😻😼😽🙀😿😾👋🤚🖐✋🖖👌🤏✌️🤞🤟🤘🤙👈👉👆👇☝️👍👎✊👊🤛🤜👏🙌👐🤲🤝🙏💅🤳💪🦾🦵🦶👂🦻👃🧠🦷👀👁👅👄💋🩸";
for(let c of emojis) { allCards.push(c); }
let state = JSON.parse(localStorage.getItem('peach_v5')) || {
  myName: '我', taName: '梦角', myAvatar: '', taAvatar: '',
  bg: '#ffffff', headerBg: '#ffffff', myBubble: '#000000', taBubble: '#f0f0f0', myText: '#ffffff', taText: '#333333', font: '-apple-system, sans-serif',
  replyMode: 'single', coins: 0, customCards: [], chats: []
};
function save() { localStorage.setItem('peach_v5', JSON.stringify(state)); }
  function render() {
  document.documentElement.style.setProperty('--bg', state.bg);
  document.documentElement.style.setProperty('--header-bg', state.headerBg);
  document.documentElement.style.setProperty('--my-bubble', state.myBubble);
  document.documentElement.style.setProperty('--ta-bubble', state.taBubble);
  document.documentElement.style.setProperty('--my-text', state.myText);
  document.documentElement.style.setProperty('--ta-text', state.taText);
  document.documentElement.style.setProperty('--font-main', state.font);
  document.getElementById('taNameDisplay').innerText = state.taName;
  document.getElementById('setMyName').value = state.myName;
  document.getElementById('setTaName').value = state.taName;
  document.getElementById('setReplyMode').value = state.replyMode;
  document.getElementById('coinDisplay').innerText = state.coins;
  document.getElementById('setFont').value = state.font;
  document.getElementById('callAvatar').style.backgroundImage = `url('${state.taAvatar}')`;
    const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = state.chats.map((m, i) => {
    if(m.recalled) return `<div class="msg-row ${m.role}" style="opacity:0.5;font-size:12px;text-align:center;"><div class="bubble" style="background:none;color:#999;border:1px dashed #ccc;">撤回了一条消息</div></div>`;
    if(m.type === 'call') return `<div class="msg-row ${m.role}"><div class="bubble" style="background:#fff;border:1px solid #eee;">📞 ${m.text}</div></div>`;
    if(m.type === 'redpacket') return `<div class="msg-row ${m.role}"><div class="bubble" style="background:#fa9d3b;color:#fff;" onclick="openRedPacket(${m.amount})">🧧 红包<br><small>点击拆开</small></div></div>`;
    return `<div class="msg-row ${m.role}"><div class="msg-info"><div class="avatar" style="background-image:url('${m.role === 'me' ? state.myAvatar : state.taAvatar}')"></div><span>${m.role === 'me' ? state.myName : state.taName}</span></div><div class="bubble" onclick="msgMenu(${i})">${m.text}</div></div>`;
  }).join('');
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
  }
  function msgMenu(i) {
  const m = state.chats[i];
  if(m.recalled) { if(m.role !== 'me') alert("原消息：" + m.originalText); return; }
  const act = prompt("操作：\n1.撤回\n2.删除\n3.编辑", "1");
  if(act === "1") { m.originalText = m.text; m.text = ""; m.recalled = true; save(); render(); }
  if(act === "2") { state.chats.splice(i, 1); save(); render(); }
  if(act === "3") { const t = prompt("修改内容：", m.text); if(t && t.trim()) { m.text = t.trim(); save(); render(); } }
}
function sendText() {
  const input = document.getElementById('msgInput'); const text = input.value.trim();
  if(!text) return; state.chats.push({ role: 'me', text: text, type: 'text' }); input.value = ''; save(); render(); triggerReply();
}
function sendCard(text) { 
  state.chats.push({ role: 'me', text: text, type: 'text' }); 
  save(); render(); closeDrawer('menuDrawer'); closeDrawer('cardDrawer'); triggerReply(); 
  }
  function triggerReply() {
  setTimeout(() => {
    if(state.replyMode === 'single') { 
      state.chats.push({ role: 'other', text: allCards[Math.floor(Math.random() * allCards.length)], type: 'text' }); save(); render(); 
    } else if(state.replyMode === 'multi') { 
      for(let i=0; i<3; i++) { setTimeout(() => { state.chats.push({ role: 'other', text: allCards[Math.floor(Math.random() * allCards.length)], type: 'text' }); save(); render(); }, i * 800); } 
    } else { 
      state.chats.push({ role: 'other', text: "我想你了～", type: 'text' }); save(); render(); 
    }
  }, 1200);
}
function sendRedPacket() {
  if(state.coins < 20) { alert("桃之币不足！"); return; }
  state.coins -= 20; state.chats.push({ role: 'me', text: '发送了一个红包', type: 'redpacket', amount: 20 }); save(); render(); closeDrawer('menuDrawer');
  setTimeout(() => { state.chats.push({ role: 'other', text: '谢谢你的红包！', type: 'text' }); save(); render(); }, 1500);
}
function openRedPacket(amount) { alert("🧧 你领到了 " + amount + " 个桃之币！"); state.coins += amount; save(); render(); }
function getRandomCoins() { const add = Math.floor(Math.random() * 50) + 10; state.coins += add; save(); render(); alert(`你获得了 ${add} 个桃之币！`); }
  let callTimer = null;
function startCall(who) {
  closeDrawer('menuDrawer'); document.getElementById('callName').innerText = state.taName;
  document.getElementById('callStatus').innerText = who === 'me' ? '正在呼叫...' : '来电中...';
  document.getElementById('callScreen').classList.add('open');
  if(who === 'me') { setTimeout(() => { if(document.getElementById('callScreen').classList.contains('open')) { document.getElementById('callStatus').innerText = '对方已接通...'; startCallTimer(); } }, 3000); } else { startCallTimer(); }
}
function startCallTimer() { let sec = 0; clearInterval(callTimer); callTimer = setInterval(() => { sec++; document.getElementById('callStatus').innerText = `通话中... ${sec}秒`; }, 1000); }
function endCall(isAccepted) {
  clearInterval(callTimer); document.getElementById('callScreen').classList.remove('open');
  if(isAccepted) { state.chats.push({ role: 'me', text: '通话结束', type: 'call' }); save(); render(); } else { alert("已挂断"); }
}
function openDrawer(id) { document.getElementById(id).classList.add('open'); if(id==='cardDrawer') renderCards(); }
function closeDrawer(id) { document.getElementById(id).classList.remove('open'); }
function updateSetting(key, val) { if(!val.trim()) return; state[key] = val.trim(); save(); render(); }
function updateColor(key, val) { state[key] = val; save(); render(); }
  function handleBackground(event) { 
  const file = event.target.files[0]; if (!file) return; 
  const reader = new FileReader(); 
  reader.onload = function(e) { state.bg = `url(${e.target.result})`; state.headerBg = 'rgba(255, 255, 255, 0.4)'; save(); render(); }; 
  reader.readAsDataURL(file); event.target.value = ''; 
}
function renderCards() {
  const keyword = document.getElementById('searchCard').value.trim(); const list = document.getElementById('cardList');
  const totalCards = allCards.concat(state.customCards || []); const filtered = keyword ? totalCards.filter(t => t.includes(keyword)) : totalCards; const toShow = keyword ? filtered : filtered.slice(0, 100);
  list.innerHTML = toShow.map(text => `<div style="background:#f5f5f5; border-radius:10px; padding:10px; font-size:13px; text-align:center;" onclick="sendCard('${text}')">${text}</div>`).join('');
}
function toggleAddCard() { const area = document.getElementById('addCardArea'); area.style.display = area.style.display === 'none' ? 'block' : 'none'; }
function saveCustomCards() {
  const text = document.getElementById('customCardText').value; const newCards = text.split('\n').map(s => s.trim()).filter(Boolean);
  if(newCards.length > 0) { state.customCards = (state.customCards || []).concat(newCards); save(); document.getElementById('customCardText').value = ''; renderCards(); alert('添加成功！'); }
}
render();
setTimeout(() => { 
  if(Math.random() > 0.7) { 
    document.getElementById('callStatus').innerText = '来电中...'; 
    document.getElementById('callScreen').classList.add('open'); 
    setTimeout(() => { if(document.getElementById('callScreen').classList.contains('open')) { endCall(false); alert(`${state.taName} 挂断了电话...`); } }, 15000); 
  } 
}, 15000);
</script>
</body>
</html>
