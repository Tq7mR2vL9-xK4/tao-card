<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peach · 传讯</title>
<style>
  :root {
    --my-bubble: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
    --ta-bubble: rgba(255, 255, 255, 0.85);
    --chat-bg: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
    --text-color: #333;
    --ta-text-color: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); background-size: cover; background-position: center; color: var(--text-color); transition: 0.3s; }
  /* 🌸 全新开屏动画 */
#intro { 
  position: fixed; inset: 0; background: #ffffff; z-index: 999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  animation: fadeOut 0.6s ease 3s forwards; pointer-events: none; 
}
.peach { 
  font-size: 28vw; font-weight: 900; 
  background: linear-gradient(135deg, #FFB6C1 0%, #FF8DA1 50%, #FFB6C1 100%); 
  -webkit-background-clip: text; background-clip: text; color: transparent; 
  filter: drop-shadow(0px 15px 20px rgba(255, 141, 161, 0.3));
  animation: float 2.5s ease-in-out infinite; 
}
.intro-text {
  font-size: 14px; color: #999; letter-spacing: 2px; font-weight: 300;
  animation: fadeIn 1.5s ease 0.5s both;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
/* 顶部导航 */
header { padding: 15px 20px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.4); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
.header-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.header-btn { background: transparent; border: none; font-size: 14px; color: #555; font-weight: 500; cursor: pointer; }

/* 聊天区域 */
#chatArea { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.msg { display: flex; align-items: flex-start; gap: 12px; max-width: 85%; animation: slideUp 0.3s ease; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.avatar { width: 44px; height: 44px; border-radius: 12px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
.bubble { padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-break: break-all; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.msg.me .bubble { background: var(--my-bubble); color: #fff; border-top-right-radius: 4px; }
.msg.other .bubble { background: var(--ta-bubble); color: var(--ta-text-color); border-top-left-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  /* 底部输入栏 */
footer { padding: 12px 15px 25px 15px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 10; }
.fake-input { flex: 1; background: rgba(255, 255, 255, 0.6); border-radius: 22px; padding: 12px 18px; color: #888; font-size: 15px; display: flex; align-items: center; cursor: pointer; }
footer button { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: none; color: #555; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; }
footer button:active { transform: scale(0.95); }

/* 抽屉面板 */
.drawer, .settings-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 100; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
.drawer { height: 70vh; }
.settings-panel { height: 60vh; overflow-y: auto; padding: 20px; gap: 15px; }
.drawer.open, .settings-panel.open { transform: translateY(0); }
.drawer-header { padding: 15px 20px; display: flex; gap: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); align-items: center; }
.drawer-header input { flex: 1; padding: 12px 15px; border-radius: 12px; border: none; background: rgba(0,0,0,0.05); color: #333; outline: none; font-size: 15px; }
.close-btn { background: transparent; border: none; color: #ff8fc7; font-size: 15px; font-weight: 600; }
